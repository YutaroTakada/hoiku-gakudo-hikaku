name: 収集・ビルド・公開

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 毎週月曜 6:00（日本時間）に公式ページを読み直す
    - cron: "0 21 * * 0"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4

      - name: 週次チェック：公式ページから施設データを集め直す
        if: github.event_name != 'push'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          python3 -m pip install -q -r scripts/requirements.txt
          python3 scripts/collect.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: ビルド（施設データのスキーマ検証を含む）
        run: npm run build

      - name: 変わったデータをコミット
        if: github.event_name != 'push'
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "データ更新（週次チェック $(date +%F)）"
            git push
          else
            echo "データに変更なし"
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
